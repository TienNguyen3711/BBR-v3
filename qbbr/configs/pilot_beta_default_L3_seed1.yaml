# L=3 variant for the Point 5 (quantum grid) bounded pilot. seed=1, n_layers=3, target_episodes=[200].
seed: 1
gamma: 0.99
learning_rate: 0.001
n_layers: 3
reward:
  alpha: 1.0
  delta: 1.0
  beta: 0.5
  eps: 1.0e-06
  eps_rtx: 1.0
decision_interval:
  rule: minrtt_100
episode:
  duration_s: 300
  target_episodes:
  - 200
