[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qbbr"
version = "0.1.0"
description = "Risk-aware quantum DRL data/state pipeline for BBR-v3 over Starlink"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "torch",
    # see requirements.txt for why these two are pinned together
    "pennylane==0.38.0",
    "autoray==0.6.12",
    "scipy",
    "itur",
    "skyfield",
    "sgp4",
]

[tool.setuptools.packages.find]
include = ["qbbr*"]

[tool.pytest.ini_options]
testpaths = ["qbbr/tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: full-corpus tests over all 2160 dataset files",
]
